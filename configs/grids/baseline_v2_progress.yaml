# Progress subset of the baseline v2 grid. Inherits every setting (tasks, steps, history,
# temperature, repro, out_dir, frozen) from baseline_v2.yaml and only replaces the rows, so
# each run here has the same run dir and config hash as in the main grid and is never rerun.
#   python -m react_baseline.grid configs/grids/baseline_v2_progress.yaml --dry-run
base: configs/grids/baseline_v2.yaml
name: baseline_v2_progress
rows:
  - {agent: react, profile: haiku-5.5, seeds: [0, 1, 2]}                                    # paid
  - {agent: react-raw, profile: haiku-5.5, tasks: [V2_task_01_tomato], seeds: [0, 1, 2]}    # paid
  - {agent: random, seeds: [0, 1, 2]}
  - {agent: random-intent, seeds: [0, 1, 2]}
  - {agent: react, profile: llama3.1-8b, tasks: [V2_task_01_tomato], seeds: [0, 1, 2]}
