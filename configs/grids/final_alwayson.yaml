# Final paid grid, always-on hybrid: same exploration agent, prompts and memory as the TKG arm, but the LLM is
# consulted at every decision (every_n with n = 1, no consecutive-decision cap). Claude Haiku 5.5, reproduction on
# with 50-step attempts, 3 grid tasks x seeds 0-2, 1,000 steps, $1.00 cap per run.
#   python -m react_baseline.grid configs/grids/final_alwayson.yaml --dry-run
#   python -m react_baseline.grid configs/grids/final_alwayson.yaml --seeds 0 --allow-paid
#   python -m react_baseline.grid configs/grids/final_alwayson.yaml --allow-paid        (all; resumable)
# Refuses to run unless the code matches both freezes and `tkg:` equals configs/frozen/tkg_v1_alwayson.yaml settings.
name: final_alwayson
frozen:
  - configs/frozen/baseline_v2_2.yaml
  - configs/frozen/tkg_v1_alwayson.yaml
out_dir: runs/grids/final_alwayson
estimate_from: runs/grids/final_react   # dry-run $: an LLM call at every decision is closest to ReAct's call rate
tasks:
  - V2_task_01_tomato
  - V2_task_07_tomato_steak
  - V2_task_11_tomato_lettuce_onion
max_env_steps: 1000
history: 10
temperature: 0.7          # where the backend supports it (Haiku 5.5 runs at its API default)
intents_per_call: 1
max_macro_len: 40
max_usd_per_paid_run: 1.00
repro:
  enabled: true
  steps: 50
  max_attempts: 5
  max_fraction: 0.3
  dedup_jaccard: 0.8
tkg:
  trigger: every_n
  trigger_n: 1
  tau: 0.15
  min_support: 3
  warmup_steps: 0
  investigate_k: 1
  max_consecutive_llm: 0   # 0 = no cap
  repro_path: true
rows:
  - {agent: tkg, profile: haiku-5.5, seeds: [0, 1, 2]}
