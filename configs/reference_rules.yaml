# Reference rules: what the game MANUAL says should happen, keyed on the TKG's ctx0 abstraction.
#
# Written ONLY from the GAME RULES text of the agents' system prompt (react_baseline/prompts.py:
# SYSTEM_PROMPT and INTENT_ACTIONS_SECTION) plus Tom's floor-movement rule (memory/reference_graph.py on
# origin/cheap-agent-baseline: a move onto a floor tile moves you there, carrying what you hold).
# bug_manager.py, the bug taxonomy and normal_play_bugs.yaml were NOT consulted. Each rule quotes the
# manual sentence it relies on (`manual`).
#
# Matching (memory/reference.py): first rule that matches wins. `when` holds regexes (full match) on the
# ctx0 parts: intent kind, the held item string (after "hands:") and the target entity state.
# Named groups are available to `expect` as {name}, plus {held}, {target} and {item_chopped} (the
# captured item with "unchopped" -> "chopped"); substituted values are regex-escaped. `expect` gives
# the outcome: event type, success (ok = not refused; any; True; False), the held item after and the
# target entity after (regexes). Situations no rule covers return None (unknown).
#
# Known places where the game differs from the manual (found on the 9 cheap trajectories of
# runs/trigger_eval/20261027-005617, see EXPERIMENT_LOG 2026-10-28) are listed under
# manual_mismatches at the end; they stay as written and are reported as manual_mismatch.

rules:
  - id: wait
    manual: "wait or wait(n) : stay in place for n steps (1-20)"
    when: {intent: [wait], held: '.*', target: '.*'}
    expect: {event: none, success: any, held_after: '{held}', target_after: '{target}'}
    changes_state: false
    says: "nothing happens; you stay in place"

  - id: move_floor
    manual: "Moving into a floor tile walks there. (Tom's floor-movement rule: you move, carrying what you hold)"
    when: {intent: [move, interact], held: '.*', target: 'floor'}
    expect: {event: move, success: any, held_after: '{held}', target_after: 'floor'}
    changes_state: true
    says: "you walk onto the floor tile, still holding the same thing"

  - id: bump_wall
    manual: "The kitchen is a grid. You walk on floor tiles."
    when: {intent: [move, interact], held: '.*', target: 'wall|edge of the map'}
    expect: {event: none, success: any, held_after: '{held}', target_after: '{target}'}
    changes_state: false
    says: "you cannot walk into it; nothing changes"

  - id: deliver_plate
    manual: "holding a plate + delivery window -> deliver the plate"
    when: {intent: [move, interact], held: 'plate:.*', target: 'delivery window:.*'}
    expect: {event: deliver, success: any, held_after: 'nothing', target_after: 'delivery window:empty'}
    changes_state: true
    says: "the plate is delivered and leaves your hands"

  - id: trash
    manual: "holding something + trash can -> throw it away"
    when: {intent: [move, interact], held: '(?!nothing$).+', target: 'trash can:.*'}
    expect: {event: dump, success: any, held_after: 'nothing', target_after: 'trash can:empty'}
    changes_state: true
    says: "what you hold is thrown away; your hands are empty"

  - id: plate_add_from_counter
    manual: "holding a plate + item or station holding an item -> put that item onto the plate; Prepared ingredients are combined on a clean plate"
    when: {intent: [move, interact], held: 'plate:clean:.*',
           target: 'counter:holding:(?P<item>chopped (?:tomato|lettuce|onion|fish)|chopped cooked steak|cooked rice)'}
    expect: {event: pickup_into_plate, success: ok, held_after: 'plate:.*', target_after: 'counter:empty'}
    changes_state: true
    says: "the prepared ingredient goes onto the clean plate you hold; the counter is empty"

  - id: plate_add_from_station
    manual: "holding a plate + item or station holding an item -> put that item onto the plate; Prepared ingredients are combined on a clean plate"
    when: {intent: [move, interact], held: 'plate:clean:.*',
           target: '(?P<station>cutting board|pan|rice cooker):holding:(?P<item>chopped (?:tomato|lettuce|onion|fish)|chopped cooked steak|cooked rice)'}
    expect: {event: pickup_into_plate, success: ok, held_after: 'plate:.*', target_after: '{station}:empty'}
    changes_state: true
    says: "the prepared ingredient goes onto the clean plate you hold; the station is empty"

  - id: pickup_from_counter
    manual: "empty hands + item on a counter -> pick it up"
    when: {intent: [move, interact], held: 'nothing', target: 'counter:holding:(?P<item>.+)'}
    expect: {event: pickup, success: ok, held_after: '{item}', target_after: 'counter:empty'}
    changes_state: true
    says: "you pick the item up; the counter is empty"

  - id: chop
    manual: "empty hands + cutting board holding food -> chop it"
    when: {intent: [move, interact], held: 'nothing', target: 'cutting board:holding:(?P<item>.*unchopped.*)'}
    expect: {event: chop, success: ok, held_after: 'nothing', target_after: 'cutting board:holding:{item_chopped}'}
    changes_state: true
    says: "the food on the cutting board gets chopped"

  - id: take_from_board
    manual: "empty hands + cutting board holding food -> chop it (a finished item is picked up instead)"
    when: {intent: [move, interact], held: 'nothing', target: 'cutting board:holding:(?P<item>(?!.*unchopped).+)'}
    expect: {event: pickup, success: ok, held_after: '{item}', target_after: 'cutting board:empty'}
    changes_state: true
    says: "you pick up the finished item; the cutting board is empty"

  - id: take_cooked
    manual: "empty hands + station holding a finished item -> take it out"
    when: {intent: [move, interact], held: 'nothing',
           target: '(?P<station>pan|rice cooker|oven):holding:(?P<item>(?!.*uncooked).*\bcooked\b.*)'}
    expect: {event: pickup, success: ok, held_after: '{item}', target_after: '{station}:empty'}
    changes_state: true
    says: "you take the finished item out; the station is empty"

  - id: take_clean_plate_from_sink
    manual: "empty hands + station holding a finished item -> take it out"
    when: {intent: [move, interact], held: 'nothing', target: 'sink:holding:(?P<item>plate:clean:.*)'}
    expect: {event: pickup, success: ok, held_after: '{item}', target_after: 'sink:empty'}
    changes_state: true
    says: "you take the clean plate out of the sink"

  - id: wash
    manual: "empty hands + sink holding a dirty plate -> wash it"
    when: {intent: [move, interact], held: 'nothing', target: 'sink:holding:plate:dirty:.*'}
    expect: {event: wash, success: any, held_after: 'nothing', target_after: 'sink:holding:plate:clean:.*'}
    changes_state: true
    says: "the plate in the sink gets washed clean"

  - id: put_on_counter
    manual: "holding something + empty counter -> put it down"
    when: {intent: [move, interact], held: '(?!nothing$).+', target: 'counter:empty'}
    expect: {event: putdown, success: ok, held_after: 'nothing', target_after: 'counter:holding:{held}'}
    changes_state: true
    says: "you put it down on the counter; your hands are empty"

  # "holding something + station -> put it into the station", narrowed by the recipe sentences that
  # say what each station is for (the oven is never described, so it is not covered).
  - id: put_on_cutting_board
    manual: "holding something + station -> put it into the station; vegetables, fish and steak are chopped on the cutting board"
    when: {intent: [move, interact], held: 'unchopped .*(?:tomato|lettuce|onion|fish|steak)', target: 'cutting board:empty'}
    expect: {event: putdown, success: ok, held_after: 'nothing', target_after: 'cutting board:holding:{held}'}
    changes_state: true
    says: "you put the food on the cutting board; your hands are empty"

  - id: put_steak_in_pan
    manual: "holding something + station -> put it into the station; Steak must be chopped and then cooked in the pan; Pans and rice cookers cook on their own while time passes"
    when: {intent: [move, interact], held: 'chopped uncooked steak', target: 'pan:empty'}
    expect: {event: putdown, success: ok, held_after: 'nothing', target_after: 'pan:holding:chopped (?:un)?cooked steak'}
    changes_state: true
    says: "you put the chopped steak in the pan; your hands are empty"

  - id: put_rice_in_cooker
    manual: "holding something + station -> put it into the station; Rice is cooked in the rice cooker; Pans and rice cookers cook on their own while time passes"
    when: {intent: [move, interact], held: 'uncooked rice', target: 'rice cooker:empty'}
    expect: {event: putdown, success: ok, held_after: 'nothing', target_after: 'rice cooker:holding:(?:un)?cooked rice'}
    changes_state: true
    says: "you put the rice in the rice cooker; your hands are empty"

  - id: put_dirty_plate_in_sink
    manual: "holding something + station -> put it into the station; Delivered plates come back dirty and can be washed in the sink"
    when: {intent: [move, interact], held: 'plate:dirty:.*', target: 'sink:empty'}
    expect: {event: putdown, success: ok, held_after: 'nothing', target_after: 'sink:holding:{held}'}
    changes_state: true
    says: "you put the dirty plate in the sink; your hands are empty"

manual_mismatches:
  # Observed on the 9 cheap trajectories of runs/trigger_eval/20261027-005617 (2026-10-28). The rule is
  # what the manual says; the game did something else. Kept as written (reported as manual_mismatch).
  - rule: pickup_from_counter
    situation: "interact | hands:nothing | counter:holding:plate:dirty:[]"
    observed: "pickup | - | hands:plate:dirty:[] | counter:holding:<another item>"
    note: "picking up the returned dirty plate reveals a second item on the same counter (9 times)"
  - rule: pickup_from_counter
    situation: "interact | hands:nothing | counter:holding:<item A>"
    observed: "pickup | - | hands:<item B> | counter:holding:<item A>"
    note: "you pick up a different item than the one shown, and the shown one stays (4 times)"
  - rule: pickup_from_counter
    situation: "interact | hands:nothing | counter:holding:unchopped onion"
    observed: "none | - | hands:nothing | counter:holding:unchopped onion"
    note: "empty hands + item on a counter, nothing happens (2 times)"
